; Каноническая сборка RED SEA для ESPidi-железа (ESP32-C3 Super Mini).
; Код автора лежит как есть в корне (REDSEA.ino) — собираем только его.
[platformio]
src_dir = .
default_envs = esp32-c3     ; `pio run` — чистая сборка кода автора (точка отсчёта)

[env:esp32-c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.git/> -<.pio/> -<tools/> -<docs/>
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

; Тестовая сборка (окружение `test`) появится, когда будет готова тестовая обвязка:
; см. tools/RIG.md, раздел «Обвязка прошивки».
