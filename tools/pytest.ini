[pytest]
testpaths = tests
addopts = -ra --tb=short
markers =
    tid(id, prio): идентификатор находки из docs/REVIEW.md и приоритет (P0/P1/P2)
    design: расхождение может быть решением автора — результат помечается «уточнить у Даниила»
    long: длинный прогон (минуты); включается флагом --long
    unit: не требует устройства
